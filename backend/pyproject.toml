[project]
name = "coherent-outreach"
version = "0.1.0"
description = "Standalone multi-channel cold-outreach platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "psycopg2-binary>=2.9",
    "python-multipart>=0.0.20",
    "cryptography>=43.0",
    "anthropic>=0.40",
    "openai>=1.55",
    "qdrant-client>=1.9",
    "aiosmtplib>=3.0",
    "aioimaplib>=1.1",
    "email-validator>=2.2",
    "phonenumbers>=8.13",
    "python-dateutil>=2.9",
    "pytz>=2024.2",
    "apscheduler>=3.10",
    "httpx>=0.27",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "structlog>=24.4",
    "tenacity>=9.0",
    "pypdf>=5.0",
    "python-docx>=1.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.7", "mypy>=1.13", "aiosmtpd>=1.4"]

[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.setuptools.packages.find]
where = ["src"]
