services:

  postgres:

    image: postgres:16

    container_name: outreach-postgres

    restart: unless-stopped

    environment:

      POSTGRES_USER: outreach

      POSTGRES_PASSWORD: outreach

      POSTGRES_DB: coherent_outreach

    ports:

      - "5432:5432"

    volumes:

      - outreach_pg_data:/var/lib/postgresql/data

    healthcheck:

      test: ["CMD-SHELL", "pg_isready -U outreach -d coherent_outreach"]

      interval: 5s

      timeout: 5s

      retries: 10

      start_period: 10s



  qdrant:

    image: qdrant/qdrant:latest

    container_name: outreach-qdrant

    restart: unless-stopped

    ports:

      - "6333:6333"

    volumes:

      - outreach_qdrant_data:/qdrant/storage



  backend:

    build:

      context: ./backend

    container_name: outreach-backend

    restart: unless-stopped

    ports:

      - "8000:8000"

    env_file:

      - ./backend/.env

    environment:

      DATABASE_URL: postgresql+asyncpg://outreach:outreach@postgres:5432/coherent_outreach

      SYNC_DATABASE_URL: postgresql+psycopg2://outreach:outreach@postgres:5432/coherent_outreach

      QDRANT_URL: http://qdrant:6333

      APP_HOST: 0.0.0.0

    depends_on:

      postgres:

        condition: service_healthy

      qdrant:

        condition: service_started



volumes:

  outreach_pg_data:

  outreach_qdrant_data:


