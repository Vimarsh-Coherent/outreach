services:
  postgres:
    image: postgres:18
    container_name: outreach-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: outreach
      POSTGRES_PASSWORD: OutreachLocal2026
      POSTGRES_DB: coherent_outreach
    volumes:
      - ./data/postgres:/var/lib/postgresql/data

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - ./data/qdrant:/qdrant/storage
